name: Tag Publish

# The one place real release publishing happens. Callable two ways:
#
#   1. uses: ./.github/workflows/tag-publish.yml with inputs.tag set --
#      the normal path now. Every version-transition workflow (cut-rc,
#      release-branch auto-bump, release) pushes its git tag *and* calls
#      this workflow directly in the same run, rather than relying on that
#      push recursively triggering a separate workflow run. GITHUB_TOKEN
#      cannot trigger other workflows from a push (GitHub's anti-recursion
#      rule), which is exactly why this used to require a PAT
#      (RELEASE_AUTOMATION_PAT) just to make the push look human enough to
#      trigger tag-publish.yml -- calling it directly sidesteps that
#      entirely, so none of the callers need a PAT anymore.
#
#   2. on.push.tags -- kept for any tag pushed from outside this repo's own
#      automation (e.g. a manual `git push origin refs/tags/x.y.z`). The
#      glob below is only a coarse pre-filter (GitHub Actions tag filters
#      don't support real regex quantifiers) -- the guard job does the real
#      validation, and deliberately excludes anything below 3.9.0 or below
#      3.8.17 so it never reacts to the ~190 legacy `x.y.z-SNAPSHOT` tags
#      already in this repo's history. The 3.8.17 floor (rather than
#      excluding 3.8.x entirely) is deliberate: GitHub Actions now owns the
#      3.8 release line starting at 3.8.17, backfilling what the retired
#      Bitbucket `release/3.8` pipeline used to publish (which stopped at
#      3.8.16) -- 3.8.0 through 3.8.16 stay excluded since those tags are
#      historical and were already published for real by Bitbucket.

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_call:
    inputs:
      tag:
        description: 'The version tag to build, test, and publish (e.g. 3.9.0 or 3.9.0-rc-1). Defaults to the pushed tag when triggered by push.'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-rc-[0-9]+)?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            if (( MAJOR > 3 || (MAJOR == 3 && MINOR >= 9) || (MAJOR == 3 && MINOR == 8 && PATCH >= 17) )); then
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              if [[ "$TAG" == *-rc-* ]]; then
                echo "is_release=false" >> "$GITHUB_OUTPUT"
              else
                echo "is_release=true" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
          fi

          echo "proceed=false" >> "$GITHUB_OUTPUT"
          echo "is_release=false" >> "$GITHUB_OUTPUT"
          echo "Tag '$TAG' is not a >=3.9 or >=3.8.17 release/rc version -- ignoring." >&2

  publish:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      packages: write
      id-token: write
    concurrency:
      group: tag-publish-${{ needs.guard.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Explicit so this checks out the right commit whether triggered by
          # the tag push itself (github.ref_name would already be the tag) or
          # by a caller workflow (still on its own branch ref otherwise).
          ref: ${{ needs.guard.outputs.version }}

      - name: Build setup
        uses: ./.github/actions/build-setup
        with:
          import-gpg: 'true'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Install (skip tests)
        # See main-build.yml -- some tests resolve a sibling module's jar
        # from the local repo at test-execution time, so every module needs
        # to already be installed before the real (tests-enabled) pass runs.
        run: make install_no_tests

      - name: Build, test, and publish to Central + GitHub Packages
        env:
          SONATYPE_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: make deploy_central

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: make docker

      - name: Publish Javadoc + OpenAPI spec to apidocs.namazustudios.com
        uses: ./.github/actions/publish-docs
        with:
          version: ${{ needs.guard.outputs.version }}
          role-to-assume: ${{ secrets.APIDOCS_STS_ROLE }}
          cloudfront-distribution-id: E30XJUM7BR8918

      - name: Create GitHub Release
        if: needs.guard.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ needs.guard.outputs.version }}" --title "${{ needs.guard.outputs.version }}" --generate-notes
