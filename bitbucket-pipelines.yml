#  Template maven-build

#  This template allows you to test and build your Java project with Maven.
#  The workflow allows running tests, code checkstyle and security scans on the default branch.

# Prerequisites: pom.xml and appropriate project structure should exist in the repository.

image:
  name: elementalcomputing/elements-web-services-ci:01993b3c8062b910c0bf1e8eb5ec7940457eaab2
  username: $DOCKER_HUB_USER
  password: $DOCKER_HUB_ACCESS_TOKEN

definitions:
  services:
    docker:
      image: docker:20.10-dind
      variables:
        DOCKER_TLS_CERTDIR: ""

clone:
  depth: full

pipelines:
  tags:
    "*":
      - step:
          size: 4x
          name: Build Tags
          services:
            - docker
          runs-on:
            - "linux"
            - "self.hosted"
          script:
            - make setup_release
            - make install_no_tests
            - make deploy
            - make docker
            - make javadoc
          after-script:
            # Collect checkstyle results, if any, and convert to Bitbucket Code Insights.
            - pipe: atlassian/checkstyle-report:0.3.0
  branches:
    "release/*":
      - step:
          size: 4x
          name: Build and Test - Release
          runs-on:
            - "linux"
            - "self.hosted"
          script:
            - make setup
            - make publish_github
            - make detach release
            - make COMMIT_MSG="Release:" commit tag
            - make push_tags publish_github_tags
          after-script:
            # Collect checkstyle results, if any, and convert to Bitbucket Code Insights.
            - pipe: atlassian/checkstyle-report:0.3.0
    "development/*":
      - step:
          size: 4x
          name: Build and Test - Development
          runs-on:
            - "linux"
            - "self.hosted"
          script:
            - make setup
            - make detach tag
            - make BRANCH=$BITBUCKET_BRANCH checkout
            - make patch
            - make COMMIT_MSG="[ci skip] Setting Next Version:" commit
            - make push push_tags publish_github publish_github_tags
          after-script:
            # Collect checkstyle results, if any, and convert to Bitbucket Code Insights.
            - pipe: atlassian/checkstyle-report:0.3.0
    "stealth/*":
      - step:
          size: 4x
          name: Build and Test - Stealth
          runs-on:
            - "linux"
            - "self.hosted"
          script:
            - make setup
            - make build
          after-script:
            # Collect checkstyle results, if any, and convert to Bitbucket Code Insights.
            - pipe: atlassian/checkstyle-report:0.3.0
    main:
      # main has moved to GitHub Actions for real build/test/publish -- this
      # step does nothing but bridge a Bitbucket push to GitHub's main so
      # anyone still pushing here doesn't get silently dropped. No build, no
      # test, no publish, no self-hosted runner/custom image needed: it's
      # pure git plumbing. A genuine conflict fails the build loudly rather
      # than being auto-resolved -- do not push tags from here (see
      # tag-publish.yml's version-scoped guard on the GitHub side).
      - step:
          name: Sync main to GitHub
          image: alpine/git:latest
          script:
            - git config --global user.name "Continuous Integration"
            - git config --global user.email "ci@getelements.dev"
            - git remote add github git@github.com:NamazuStudios/elements.git || true
            - git fetch github main
            - |
              if git merge-base --is-ancestor github/main HEAD; then
                echo "GitHub main already up to date with this push, nothing to merge"
              else
                git merge --no-edit github/main || { echo "CONFLICT syncing main to GitHub -- manual resolution required"; exit 1; }
              fi
            - git push github HEAD:main
  default:
    - step:
        size: 4x
        name: Build and Test
        services:
          - docker
        runs-on:
          - "linux"
          - "self.hosted"
        caches:
          - maven
        script:
          - make setup
          - make install_no_tests
          - make build_github
          - make docker
          - make publish_github
        after-script:
          # Collect checkstyle results, if any, and convert to Bitbucket Code Insights.
          - pipe: atlassian/checkstyle-report:0.3.0
